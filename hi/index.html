<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrián Núñez Ferdmann - Humanists International Portal</title>
  <meta name="description" content="Adrián Núñez Ferdmann - Personal Portal & vCard for Humanists International. Scan the QR code to save contact info.">
  <link rel="icon" type="image/png" href="../img/HI_Logo_RGB.png" />
  
  <!-- Typography & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --hi-cerise: #e61b61;
      --hi-cerise-hover: #d20d4b;
      --hi-cerise-light: #fef0f5;
      --bg-page: #101419;
      --card-bg: #ffffff;
      --text-primary: #121820;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border-subtle: #f0f2f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(230, 27, 97, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 40%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #e61b61, #ff699a, #e61b61);
    }

    .logo-header {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .logo-header img {
      width: 80%;
      max-width: 220px;
      height: auto;
      object-fit: contain;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
      color: var(--text-primary);
    }

    .subtitle {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--hi-cerise);
      background: var(--hi-cerise-light);
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 24px;
    }

    .qr-container {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .qr-card {
      display: inline-block;
      background-color: #ffffff;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #eef0f3;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .qr-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(230, 27, 97, 0.15);
    }

    .qr-code {
      width: 180px;
      height: 180px;
      display: block;
    }

    .qr-instruction {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .btn-portal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background-color: var(--hi-cerise);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(230, 27, 97, 0.3);
    }

    .btn-portal:hover {
      background-color: var(--hi-cerise-hover);
      box-shadow: 0 6px 18px rgba(230, 27, 97, 0.4);
    }

    .btn-portal:active {
      transform: scale(0.98);
    }

    .icon-svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
    }

    .footer a {
      color: #cbd5e1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-header">
      <img src="../img/HI_Logo_RGB.png" alt="Humanists International" />
    </div>
    <h1 class="title">Adrián Núñez Ferdmann</h1>
    <span class="subtitle">Humanists International</span>
    
    <div class="qr-container">
      <a href="qr/" class="qr-card" title="Scan with camera or click to open card">
        <img src="qr/qr-vcard.svg" alt="Contact vCard QR Code" class="qr-code" />
      </a>
      <p class="qr-instruction">Scan with phone camera to add contact</p>
    </div>

    <a href="qr/" class="btn-portal">
      <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 21h3v-3h-3v3zM16 18h3v-3h-3v3zM13 15h3v-3h-3v3zM19 18h2v-3h-2v3zM19 21h2v-3h-2v3zM16 21h3v-3h-3v3zM18 13h3v-2h-3v2z" />
      </svg>
      View Full Contact Card
    </a>
  </div>

  <div class="footer">
    <p>Humanists International · <a href="https://humanists.international" target="_blank" rel="noopener">humanists.international</a></p>
  </div>
</body>
</html>
